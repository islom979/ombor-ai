# Backend va AI agent worker'ni birga ishga tushirish.
# Ma'lumotlar bazasi — Supabase (DATABASE_URL backend/.env da).
# Frontend odatda Vercel'da yoki `npm run build && npm start` bilan ishlaydi.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-worker:
    build: ./ai_agent
    env_file: ./ai_agent/.env
    environment:
      OMBOR_API_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
